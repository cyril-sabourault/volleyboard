<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Volleyboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="main-container">
            <div id="court-container">
                <div id="court">
                    <svg id="svg-court" width="100%" height="100%" style="position: absolute; top: 0; left: 0; z-index: 5;">
                        <defs>
                                                    <marker id="arrowhead" markerWidth="7" markerHeight="5" 
                                                    refX="0" refY="2.5" orient="auto">
                                                        <polygon points="0 0, 7 2.5, 0 5" />
                                                    </marker>                        </defs>
                    </svg>
                    <div class="net"></div>
                    <div class="line top-line"></div>
                    <div class="line bottom-line"></div>
                    <div class="line left-line"></div>
                    <div class="line right-line"></div>
                    <div class="line middle-line"></div>
                    <div class="line attack-line-top"></div>
                    <div class="line attack-line-bottom"></div>
                </div>
            </div>
            <div id="toolbar">
                <div id="toolbar-buttons">
                    <button id="select-tool" title="Select"><i class="fa-solid fa-mouse-pointer"></i></button>
                    <button id="add-player" title="Add Player"><i class="fa-solid fa-user-plus"></i></button>
                    <button id="add-ball" title="Add Ball"><i class="fa-solid fa-volleyball"></i></button>
                    <button id="draw-line" title="Draw Line"><i class="fa-solid fa-arrow-up-long" style="transform: rotate(45deg);"></i></button>
                    <button id="clear-all" title="Clear All"><i class="fa-solid fa-trash"></i></button>
                    <button id="undo" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
                    <button id="redo" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
                    <div id="color-palette"></div>
                </div>
            </div>
            <button id="toggle-toolbar-btn"></button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
